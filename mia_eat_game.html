<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Chomper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
  #game-container { position: relative; }
  canvas { display: block; }
  #status-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.75); color: white; font-size: 22px; text-align: center;
    pointer-events: none;
  }
  #status-overlay.hidden { display: none; }
  #status-title { font-size: 32px; font-weight: bold; margin-bottom: 12px; }
  #status-sub { font-size: 16px; color: #aaa; margin-top: 8px; }
  #start-btn {
    margin-top: 20px; padding: 12px 32px; font-size: 18px; border: none;
    background: #4CAF50; color: white; border-radius: 8px; cursor: pointer;
    pointer-events: all;
  }
  #start-btn:hover { background: #45a049; }
</style>
</head>
<body>
<div id="game-container">
  <div id="status-overlay">
    <div id="status-title">Face Chomper</div>
    <div id="status-msg">Loading face detection model...</div>
    <div id="status-sub">Please allow camera access when prompted</div>
    <button id="start-btn" style="display:none" onclick="startGame()">Start Game</button>
  </div>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.5/dist/face-landmarks-detection.min.js"></script>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let detector = null;
let capture = null;
let gameActive = false;
let score = 0;
let lives = 3;
let shapes = [];
let mouthOpen = false;
let mouthCenterX = 0;
let mouthCenterY = 0;
let mouthWidth = 0;
let mouthHeight = 0;
let faceDetected = false;
let lastDetectTime = 0;
let eatFlash = 0;
let deathFlash = 0;
let gameOverShown = false;
let particles = [];

const W = 800;
const H = 600;
let frameCounter = 0;

// Difficulty scales with score
// Speed: starts 2–5, ramps up to 4–10 by score 50
function getSpeedMin() { return 2 + Math.min(score / 50, 1) * 2; }
function getSpeedMax() { return 5 + Math.min(score / 50, 1) * 5; }
// Spawn interval: starts every 90 frames, drops to 40 by score 50
function getSpawnInterval() { return Math.max(40, 90 - score * 1); }
// Square probability: starts 35%, rises to 55% by score 30
function getSquareChance() { return Math.min(0.55, 0.35 + score * 0.007); }
// Difficulty label for HUD
function getDifficultyLabel() {
  if (score < 5)  return { text: 'EASY',    r: 100, g: 220, b: 100 };
  if (score < 15) return { text: 'MEDIUM',  r: 255, g: 200, b: 60  };
  if (score < 30) return { text: 'HARD',    r: 255, g: 130, b: 40  };
  if (score < 50) return { text: 'INTENSE', r: 255, g: 60,  b: 60  };
  return                 { text: 'INSANE',  r: 220, g: 40,  b: 220 };
}

// Mouth landmark indices for MediaPipe Face Mesh
// Upper lip top: 13, Lower lip bottom: 14 (inner)
// Outer: upper 0->12: 61,185,40,39,37,0,267,269,270,409,291
// Inner mouth top: 13, bottom: 14
// We use: top of inner upper lip = 13, bottom of inner lower lip = 14
// Left corner = 61, Right corner = 291
const UPPER_LIP_IDX = 13;
const LOWER_LIP_IDX = 14;
const LEFT_CORNER_IDX = 61;
const RIGHT_CORNER_IDX = 291;
const MOUTH_OPEN_THRESHOLD = 0.12; // ratio of mouth height to face height

// ─── p5 Sketch ───────────────────────────────────────────────────────────────
const sketch = (p) => {

  p.setup = () => {
    const cnv = p.createCanvas(W, H);
    cnv.parent('game-container');
    capture = p.createCapture(p.VIDEO, () => {
      capture.hide();
      loadModel();
    });
    capture.size(W, H);
    p.textFont('monospace');
  };

  p.draw = () => {
    // Draw mirrored camera feed
    p.push();
    p.translate(W, 0);
    p.scale(-1, 1);
    p.image(capture, 0, 0, W, H);
    p.pop();

    // Dark overlay when game not running
    if (!gameActive) {
      return;
    }

    frameCounter++;

    // Run face detection every 3 frames for performance
    if (p.frameCount % 3 === 0) {
      runDetection();
    }

    // Spawn shapes — interval shrinks as score rises
    if (frameCounter % Math.floor(getSpawnInterval()) === 0) {
      spawnShape(p);
      // At higher scores, occasionally spawn a second shape in the same frame
      if (score >= 20 && Math.random() < (score - 20) / 80) spawnShape(p);
    }

    // Update & draw shapes
    for (let i = shapes.length - 1; i >= 0; i--) {
      const s = shapes[i];
      s.x += s.vx;
      s.y += s.vy;

      // Remove if off screen
      if (s.x < -80 || s.x > W + 80 || s.y < -80 || s.y > H + 80) {
        shapes.splice(i, 1);
        continue;
      }

      // Check mouth collision
      if (mouthOpen && faceDetected) {
        const mx = W - mouthCenterX; // mirror
        const my = mouthCenterY;
        const dist = p.dist(mx, my, s.x, s.y);
        const eatRadius = (mouthWidth * 0.5) + s.size * 0.5;

        if (dist < eatRadius) {
          if (s.type === 'circle') {
            score++;
            eatFlash = 15;
            spawnParticles(p, s.x, s.y, '#4CAF50', 12);
          } else {
            lives--;
            deathFlash = 20;
            spawnParticles(p, s.x, s.y, '#f44336', 16);
            if (lives <= 0) {
              endGame();
            }
          }
          shapes.splice(i, 1);
          continue;
        }
      }

      // Draw shape
      p.push();
      p.noStroke();
      if (s.type === 'circle') {
        p.fill(s.color[0], s.color[1], s.color[2], 220);
        p.ellipse(s.x, s.y, s.size * 2, s.size * 2);
        // Shine
        p.fill(255, 255, 255, 80);
        p.ellipse(s.x - s.size * 0.25, s.y - s.size * 0.25, s.size * 0.6, s.size * 0.6);
      } else {
        p.fill(s.color[0], s.color[1], s.color[2], 220);
        p.rect(s.x - s.size, s.y - s.size, s.size * 2, s.size * 2, 4);
        // X mark inside square
        p.stroke(255, 80, 80, 180);
        p.strokeWeight(2);
        p.line(s.x - s.size * 0.5, s.y - s.size * 0.5, s.x + s.size * 0.5, s.y + s.size * 0.5);
        p.line(s.x + s.size * 0.5, s.y - s.size * 0.5, s.x - s.size * 0.5, s.y + s.size * 0.5);
      }
      p.pop();
    }

    // Draw particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= 3;
      pt.vy += 0.15;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      p.noStroke();
      const alpha = p.map(pt.life, 0, 100, 0, 220);
      p.fill(pt.r, pt.g, pt.b, alpha);
      p.ellipse(pt.x, pt.y, pt.size * (pt.life / 100));
    }

    // Draw mouth indicator
    if (faceDetected) {
      const mx = W - mouthCenterX;
      const my = mouthCenterY;
      p.noFill();
      if (mouthOpen) {
        p.stroke(100, 255, 100, 180);
        p.strokeWeight(3);
      } else {
        p.stroke(255, 255, 100, 120);
        p.strokeWeight(2);
      }
      p.ellipse(mx, my, mouthWidth * 1.1, mouthHeight * 1.8);
    }

    // Screen flash effects
    if (eatFlash > 0) {
      p.noStroke();
      p.fill(100, 255, 100, eatFlash * 8);
      p.rect(0, 0, W, H);
      eatFlash--;
    }
    if (deathFlash > 0) {
      p.noStroke();
      p.fill(255, 50, 50, deathFlash * 9);
      p.rect(0, 0, W, H);
      deathFlash--;
    }

    // HUD
    drawHUD(p);

    // No face warning
    if (!faceDetected) {
      p.fill(255, 200, 50, 200);
      p.noStroke();
      p.textSize(15);
      p.textAlign(p.CENTER);
      p.text('No face detected — center your face in camera', W / 2, H - 20);
    }
  };
};

function drawHUD(p) {
  // Top-right panel — taller to fit difficulty label
  const panelW = 160;
  const panelH = 100;
  const px = W - panelW - 16;
  const py = 12;

  p.noStroke();
  p.fill(0, 0, 0, 160);
  p.rect(px, py, panelW, panelH, 8);

  // Score
  p.textAlign(p.LEFT);
  p.fill(200, 200, 200);
  p.textSize(13);
  p.text('SCORE', px + 12, py + 22);
  p.fill(255, 255, 255);
  p.textSize(22);
  p.text(score, px + 12, py + 46);

  // Lives
  p.fill(200, 200, 200);
  p.textSize(13);
  p.text('LIVES', px + 90, py + 22);

  for (let i = 0; i < 3; i++) {
    if (i < lives) {
      p.fill(255, 80, 80);
    } else {
      p.fill(80, 80, 80);
    }
    p.noStroke();
    drawHeart(p, px + 98 + i * 22, py + 38, 8);
  }

  // Difficulty label
  const diff = getDifficultyLabel();
  p.fill(diff.r, diff.g, diff.b);
  p.textSize(12);
  p.textAlign(p.LEFT);
  p.text('DIFFICULTY: ' + diff.text, px + 12, py + 88);

  // Mouth open indicator (top-left)
  p.noStroke();
  p.fill(0, 0, 0, 140);
  p.rect(12, 12, 130, 32, 6);
  if (mouthOpen) {
    p.fill(80, 255, 80);
    p.textSize(14);
    p.textAlign(p.LEFT);
    p.text('MOUTH OPEN!', 22, 33);
  } else {
    p.fill(180, 180, 180);
    p.textSize(14);
    p.textAlign(p.LEFT);
    p.text('mouth closed', 22, 33);
  }
}

function drawHeart(p, x, y, size) {
  p.beginShape();
  p.vertex(x, y + size * 0.4);
  p.bezierVertex(x, y, x - size, y, x - size, y + size * 0.4);
  p.bezierVertex(x - size, y + size * 0.8, x, y + size * 1.2, x, y + size * 1.5);
  p.bezierVertex(x, y + size * 1.2, x + size, y + size * 0.8, x + size, y + size * 0.4);
  p.bezierVertex(x + size, y, x, y, x, y + size * 0.4);
  p.endShape(p.CLOSE);
}

function spawnShape(p) {
  const type = Math.random() < (1 - getSquareChance()) ? 'circle' : 'square';
  const size = p.random(18, 34);
  const speed = p.random(getSpeedMin(), getSpeedMax());

  // Pick a random edge to spawn from
  const edge = Math.floor(Math.random() * 4);
  let x, y, vx, vy;

  if (edge === 0) { // left
    x = -size; y = p.random(80, H - 80);
    vx = speed; vy = p.random(-1, 1);
  } else if (edge === 1) { // right
    x = W + size; y = p.random(80, H - 80);
    vx = -speed; vy = p.random(-1, 1);
  } else if (edge === 2) { // top
    x = p.random(80, W - 80); y = -size;
    vx = p.random(-1, 1); vy = speed;
  } else { // bottom
    x = p.random(80, W - 80); y = H + size;
    vx = p.random(-1, 1); vy = -speed;
  }

  let color;
  if (type === 'circle') {
    const hues = [
      [100, 220, 120],
      [80, 180, 255],
      [255, 220, 60],
      [200, 120, 255],
      [60, 230, 220]
    ];
    color = hues[Math.floor(Math.random() * hues.length)];
  } else {
    color = [180, 60, 60];
  }

  shapes.push({ type, x, y, vx, vy, size, color });
}

function spawnParticles(p, x, y, hex, count) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  for (let i = 0; i < count; i++) {
    const angle = p.random(p.TWO_PI);
    const speed = p.random(2, 7);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      r, g, b,
      life: p.random(60, 100),
      size: p.random(6, 14)
    });
  }
}

// ─── Face Detection ──────────────────────────────────────────────────────────
async function loadModel() {
  const overlay = document.getElementById('status-overlay');
  const msg = document.getElementById('status-msg');

  try {
    msg.textContent = 'Loading TensorFlow.js model...';
    await tf.ready();

    msg.textContent = 'Loading face landmark model...';
    detector = await faceLandmarksDetection.createDetector(
      faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
      {
        runtime: 'tfjs',
        refineLandmarks: false,
        maxFaces: 1
      }
    );

    msg.textContent = 'Model ready!';
    document.getElementById('status-title').textContent = 'Face Chomper';
    document.getElementById('status-sub').textContent = 'Open your mouth to eat circles. Avoid squares!';
    document.getElementById('start-btn').style.display = 'block';
    msg.textContent = '';

  } catch (err) {
    msg.textContent = 'Error loading model: ' + err.message;
    console.error(err);
  }
}

async function runDetection() {
  if (!detector || !capture || !gameActive) return;
  const now = Date.now();
  if (now - lastDetectTime < 60) return;
  lastDetectTime = now;

  try {
    const videoEl = capture.elt;
    if (videoEl.readyState < 2) return;

    const faces = await detector.estimateFaces(videoEl);

    if (faces.length === 0) {
      faceDetected = false;
      return;
    }

    faceDetected = true;
    const kp = faces[0].keypoints;

    // Get key points
    const upperLip = kp[UPPER_LIP_IDX];
    const lowerLip = kp[LOWER_LIP_IDX];
    const leftCorner = kp[LEFT_CORNER_IDX];
    const rightCorner = kp[RIGHT_CORNER_IDX];

    // Compute mouth metrics
    const mouthH = Math.abs(lowerLip.y - upperLip.y);
    const mouthW = Math.abs(rightCorner.x - leftCorner.x);

    mouthCenterX = (leftCorner.x + rightCorner.x) / 2;
    mouthCenterY = (upperLip.y + lowerLip.y) / 2;
    mouthWidth = mouthW;
    mouthHeight = mouthH;

    // Use ratio of mouth height to width as open indicator
    const openRatio = mouthH / (mouthW || 1);
    mouthOpen = openRatio > MOUTH_OPEN_THRESHOLD;

  } catch (e) {
    // Silent fail on detection errors
  }
}

// ─── Game Control ─────────────────────────────────────────────────────────────
function startGame() {
  score = 0;
  lives = 3;
  shapes = [];
  particles = [];
  frameCounter = 0;
  eatFlash = 0;
  deathFlash = 0;
  gameOverShown = false;
  gameActive = true;
  document.getElementById('status-overlay').classList.add('hidden');
}

function endGame() {
  gameActive = false;
  gameOverShown = true;
  const overlay = document.getElementById('status-overlay');
  overlay.classList.remove('hidden');
  document.getElementById('status-title').textContent = 'Game Over!';
  document.getElementById('status-msg').textContent = 'Final Score: ' + score;
  document.getElementById('status-sub').textContent = 'You ate too many squares!';
  document.getElementById('start-btn').textContent = 'Play Again';
  document.getElementById('start-btn').style.display = 'block';
}

// ─── Boot ────────────────────────────────────────────────────────────────────
new p5(sketch);
</script>
</body>
</html>
